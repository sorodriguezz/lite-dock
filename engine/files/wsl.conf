# =============================================================================
#  /etc/wsl.conf  —  LiteDock engine distro (litedock-engine)
# =============================================================================
#  Read by WSL2 when the distro starts, BEFORE /usr/local/bin/litedock-init.sh
#  runs. Controls how Windows mounts drives, manages DNS, and which user we get.
#  Keep this minimal: this distro exists only to host dockerd, not for humans.
# =============================================================================

[automount]
# Mount Windows drives (C:, D: ...) under /mnt so bind-mounting host paths into
# containers works (e.g. `-v C:\code:/app` surfaces as /mnt/c/code inside).
enabled = true
# We never ship an /etc/fstab in this image, so don't waste boot time parsing
# one. (If a future feature needs fstab mounts, flip this to true.)
mountFsTab = false
# metadata => let Linux store chmod/chown bits on Windows-backed files, so file
# permissions behave sanely for bind mounts. uid=0/gid=0 because this distro
# runs entirely as root (single-purpose engine host).
options = "metadata,uid=0,gid=0"

[network]
# Let WSL generate /etc/resolv.conf from the Windows DNS configuration so the
# engine (and `docker pull`) can resolve registry hostnames out of the box.
generateResolvConf = true

[user]
# Default to root. The Windows app already launches the init script with
# `-u root`, but defaulting here means any manual `wsl -d litedock-engine`
# debugging session also lands as root without extra flags.
default = root

[boot]
# CRITICAL: do NOT start systemd. This distro has no systemd installed and we
# don't want WSL trying to bring one up. dockerd is started ON DEMAND by the
# Windows app via `wsl --exec litedock-init.sh`, and stopped via
# `wsl --terminate litedock-engine`. Starting nothing at boot keeps the distro
# at ~0 RAM/CPU when the user isn't actively using Docker — the whole point of
# LiteDock's low idle footprint.
systemd = false
# (Intentionally no `command = ...` here. If we set a boot command, WSL would
#  launch dockerd whenever ANYTHING touches the distro, defeating on-demand
#  start. The app owns the engine lifecycle explicitly instead.)
