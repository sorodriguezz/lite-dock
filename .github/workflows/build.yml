name: build

# PR build check: builds the engine rootfs (Linux runner, has Docker) and the
# Windows installer (Windows runner) and uploads them as artifacts, so pull
# requests are validated end-to-end. Releases for `main` are handled by
# release.yml (which also tags + publishes a GitHub Release).

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  engine:
    name: Engine rootfs (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest runners ship with Docker, so the Docker-based builder works.
      - name: Build litedock-engine.tar
        run: bash engine/build-rootfs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: litedock-engine
          path: src-tauri/resources/litedock-engine.tar
          if-no-files-found: error

  app:
    name: Windows installer
    needs: engine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      # Pull the engine tar produced by the `engine` job into the resources dir.
      - uses: actions/download-artifact@v4
        with:
          name: litedock-engine
          path: src-tauri/resources
      - name: Fetch bundled docker CLI
        shell: pwsh
        run: ./scripts/fetch-docker-cli.ps1
      - name: Install frontend deps
        run: npm install
      - name: Build (Vite + Rust + NSIS bundler)
        run: npm run tauri build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: litedock-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
